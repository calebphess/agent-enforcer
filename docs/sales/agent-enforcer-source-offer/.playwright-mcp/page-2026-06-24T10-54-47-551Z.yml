        - paragraph [ref=e22]:
          - text: Alchemist is pleased to present this Founding Partner Proposal for the deployment of
          - strong [ref=e23]: Agent Enforcer
          - text: "- an enterprise AI policy enforcement platform purpose-built for government environments."
