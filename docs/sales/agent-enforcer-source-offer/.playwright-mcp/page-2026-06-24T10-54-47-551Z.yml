        - img "Opportunity timeline showing Pre-AI Development, NOW, and AI-Augmented Development with risk meter" [ref=e37]
        - paragraph [ref=e38]: Federal agencies are in a brief but consequential window. AI coding assistants are being deployed at scale - and the governance frameworks to control them are still catching up.
        - paragraph [ref=e39]: Every day an AI agent runs without enforcement is a day that code is generated without verification, compliance documentation reflects intent rather than output, token spend accrues without efficiency gains, and the organization's AI posture remains undocumented to auditors.
        - paragraph [ref=e40]: Agent Enforcer closes this window.
