        - paragraph [ref=e31]:
          - text: This proposal covers a full Agency-tier deployment of Agent Enforcer for up to 1,000 registered enforcement agents, a dedicated Managed Enforcement Specialist embedded with your organization, and a Founding Partner rate reflecting
          - strong [ref=e32]: CIA
          - text: "'s position as an early adopter and strategic reference account."
